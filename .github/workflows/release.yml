name: release
# Push a tag like v0.5.0: the tests run, then a zip of the app (with a REPO file for the update check) becomes a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poppler for the PDF checks
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Tests
        run: python tests/run.py
      - name: Zip
        run: |
          name="bewerbungs-board-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix=bewerbungs-board/ -o "$name.zip" HEAD
          mkdir -p bewerbungs-board && echo "$GITHUB_REPOSITORY" > bewerbungs-board/REPO
          zip "$name.zip" bewerbungs-board/REPO
          sha256sum "$name.zip" > "$name.zip.sha256"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bewerbungs-board-*.zip* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Unzip, then run ./bewerbungs-board --open (Windows: bewerbungs-board.cmd --open, untested so far)."
