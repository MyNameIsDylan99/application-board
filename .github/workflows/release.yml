name: release
# Push a tag like v0.5.0: the tests run, then a zip of the app (with a REPO file for the update check) becomes a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poppler for the PDF checks
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Tests
        run: python tests/run.py
      - name: Zip
        run: |
          name="application-board-${GITHUB_REF_NAME}"
          git archive --format=zip --prefix=application-board/ -o "$name.zip" HEAD
          tmp=$(mktemp -d)  # not in the checkout: there "application-board" is the start script
          mkdir "$tmp/application-board" && echo "$GITHUB_REPOSITORY" > "$tmp/application-board/REPO"
          (cd "$tmp" && zip "$GITHUB_WORKSPACE/$name.zip" application-board/REPO)
          sha256sum "$name.zip" > "$name.zip.sha256"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" application-board-*.zip* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Unzip, then run ./application-board --open (Windows: application-board.cmd --open, untested so far)."
